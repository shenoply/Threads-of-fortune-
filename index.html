<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale/user-scalable=no stop a quick double-tap on a button (the objective banner, a
     bazaar sign) from being read as the browser's own double-tap-to-zoom gesture, which otherwise
     zooms the whole page in and leaves it "stuck" there — this is a native app-like map/stall UI,
     not a document meant to be pinch-zoomed. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<!-- The built JS/CSS get a fresh hashed filename on every deploy (see vite.config), so once the browser
     has fetched this page it always finds the latest build; what can go stale is this page itself — a
     phone or an in-between proxy holding onto an old index.html forever keeps pointing at an old build,
     which is why a fix that's clearly live in the repo can still look unfixed on a particular phone. These
     ask the browser not to do that. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Threads of Fortune</title>
<!-- launched from the home screen it opens full screen, with no address bar -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#120b06" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Threads" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- the fonts load alongside the game rather than holding up the first screen -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=UnifrakturCook:wght@700&family=Amiri:wght@400;700&display=swap" media="print" onload="this.media='all'" />
<style>
  html, body { background: #120b06; margin: 0; }
  #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #120b06; color: #e8d2a6; font: 600 18px Georgia, serif; letter-spacing: .04em; transition: opacity .35s; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .bar { width: min(260px, 70vw); height: 6px; border-radius: 3px; background: #2a1c10; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0; background: #d9a441; border-radius: 3px; transition: width .3s; }
  #boot small { font: 13px Georgia, serif; color: #a8916a; letter-spacing: 0; }
</style>
</head>
<body>
<div id="boot" role="progressbar" aria-label="Loading the game"><div>Threads of Fortune</div><div class="bar"><i></i></div><small>Loading the bazaar…</small></div>
<script>
  // how much of the game's code has arrived, from what the browser reports; it creeps on while it waits
  (function () {
    var bar = document.querySelector('#boot .bar i'), p = 4, t0 = Date.now();
    var tick = setInterval(function () {
      var b = document.getElementById('boot'); if (!b || b.classList.contains('done')) { clearInterval(tick); return; }
      var got = 0; try { performance.getEntriesByType('resource').forEach(function (e) { if (/\/assets\//.test(e.name)) got += e.encodedBodySize || e.transferSize || 0; }); } catch (e) {}
      var byBytes = Math.min(92, got / 7000); // about 700 KB of code over the wire
      p = Math.max(p + (92 - p) * 0.02, byBytes); bar.style.width = p + '%';
      if (Date.now() - t0 > 6000) document.querySelector('#boot small').textContent = 'Still loading: a slow connection. It is quicker next time.';
    }, 120);
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
