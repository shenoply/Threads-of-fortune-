name: Mac build

# Run by hand from the Actions tab: "Mac build" -> Run workflow.
# The app appears at the bottom of the run page under Artifacts (works on Apple Silicon and Intel Macs).
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix desktop ci
      - name: Mac icon from the PNG
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s desktop/build/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d desktop/build/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o desktop/build/icon.icns
      - run: npm run package:mac
      - uses: actions/upload-artifact@v4
        with:
          name: ThreadsOfFortune-mac
          path: release/*darwin*.zip
          compression-level: 0
          retention-days: 14
